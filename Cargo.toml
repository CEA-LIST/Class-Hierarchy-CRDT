[package]
name = "class-hierarchy"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"

[dependencies]
moirai-protocol = { git = "https://github.com/CEA-LIST/Moirai.git", tag = "v0.8.2", features = [
    "sink",
] }
moirai-crdt = { git = "https://github.com/CEA-LIST/Moirai.git", tag = "v0.8.2", default-features = false }
moirai-macros = { git = "https://github.com/CEA-LIST/Moirai.git", tag = "v0.8.2" }
moirai-fuzz = { git = "https://github.com/CEA-LIST/Moirai.git", tag = "v0.8.2" }
petgraph = "0.8.3"
rustc-hash = "2.1.3"
arachne-xmi = { path = "runtime/arachne-xmi" }
deepsize = { git = "https://github.com/leo-olivier/deepsize.git", optional = true, features = [
    "elsa",
] }
vf2 = "1.0.1"
rand = "0.10.3"

[features]
default = ["fuzz", "sink"]
fuzz = ["moirai-crdt/fuzz", "moirai-macros/fuzz", "test_utils"]
sink = ["moirai-protocol/sink", "moirai-macros/sink", "moirai-crdt/sink"]
test_utils = [
    "dep:deepsize",
    "moirai-protocol/test_utils",
    "moirai-macros/test_utils",
    "moirai-crdt/test_utils",
]
